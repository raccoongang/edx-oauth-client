{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% trans "Continue registration step" %}</title>
        <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <!-- jQuery and JS bundle w/ Popper.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>

    <style>
        .card {
            margin: 0 auto; /* Added */
            float: none; /* Added */
            margin-bottom: 10px; /* Added */
        }
    </style>

</head>
<body style="background-color: #F5F5F5;">

    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 card mt-5 pt-5" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title text-center">{% trans "Continue registration process" %}</h5>
                    <h6 class="card-subtitle mb-2 text-muted text-center pt-2">{% trans "Please, fill in the form your email" %}</h6>
                    <form action="{{ path }}" method="POST">
                        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                        <input type="hidden" name="partial_token" value="{{ partial_token }}">
                        <input type="hidden" name="state" value="{{ state }}">
                        <input type="hidden" name="code" value="{{ code }}">
                        <div class="form-group">
                            <label for="email">{% trans "Email address" %}</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   aria-describedby="emailHelp" placeholder="{% trans 'Enter email' %}">
                            <small class="form-text text-muted">
                                {% trans "This email will be used for platform notifications and communications." %}
                            </small>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="btn btn-primary">{% trans "Continue registration" %}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
